<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAYAT FIT ZONE</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }
        img.logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            object-fit: cover;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .schedule-box {
            background-color: #111111;
            border: 1px solid #ffffff;
            padding: 15px;
            margin-bottom: 15px;
            text-align: left;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            box-sizing: border-box;
        }
        button {
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="HFZ logo.png" alt="Hayat Fit Zone Logo" class="logo">
        <h1>HAYAT FIT ZONE</h1>
        
        <div class="schedule-box">
            <h3>Add Workout Schedule</h3>
            <input type="text" id="dayInput" placeholder="Day (e.g., Monday - Chest)">
            <input type="text" id="workoutInput" placeholder="Workout Details">
            <button onclick="addSchedule()">Save Schedule</button>
        </div>

        <div class="schedule-box">
            <h3>Your Schedules</h3>
            <div id="scheduleList">No schedules added yet.</div>
        </div>
    </div>

    <script>
        function addSchedule() {
            const day = document.getElementById('dayInput').value;
            const workout = document.getElementById('workoutInput5').value || document.getElementById('workoutInput').value;
            
            const dayVal = document.getElementById('dayInput').value;
            const workVal = document.getElementById('workoutInput').value;

            if(dayVal && workVal) {
                const list = document.getElementById('scheduleList');
                if(list.innerText === "No schedules added yet.") {
                    list.innerText = "";
                }
                const item = document.createElement('div');
                item.style.borderBottom = "1px solid #333";
                item.style.padding = "5px 0";
                item.innerHTML = `<strong>${dayVal}</strong>: ${workVal}`;
                list.appendChild(item);
                
                document.getElementById('dayInput').value = '';
                document.getElementById('workoutInput').value = '';
            } else {
                alert("Please fill in both fields!");
            }
        }
    </script>
</body>
</html>
